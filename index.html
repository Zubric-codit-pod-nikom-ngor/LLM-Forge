<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hello World!</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Sen:wght@400..800&display=swap" rel="stylesheet">
</head>
<body style="overflow: hidden">

    <div class="Center"
    style="box-shadow: black 0 0 100px; width: calc(100% - 50px); height: calc(100% - 50px); background: #2e2e2e; border-radius: 12px; overflow: hidden; z-index: 2">
        <div class="BorderHoverGlow Center" style="z-index: 2"></div>
        <div class="DarkDiv Center"
        style="width: calc(100% - 8px); height: calc(100% - 8px); z-index: 3; border: transparent; background: linear-gradient(-135deg, #1F1F1F, #080808)">

            <div class="Center PosCentrally">
                <div class="PosHorizontally" style="position: fixed; margin-bottom: 55px; z-index: 4">
                    <h1 class="BBHBartleFont NoSelect"
                    style="color: #ffffff; font-style: italic; font-size: 2.5rem">LLM</h1>
                    <h1 class="SenFont NoSelect"
                    style="color: #ffffff; margin-left: 15px; font-size: 2.5rem;">Forge</h1>
                </div>
                <div style="background: transparent; width: fit-content; height: 2rem; padding-left: 10px; padding-right: 10px; font-size: 1.5rem; color: white; position: relative; top: 25px; z-index: 5"
                onclick="SmoothTransition('.\\main.html')" class="PosCentrally SquareBrackets SquareBracketsHover" id="enter-button">
                    <p class="GoogleCodeFont NoSelect" style="font-size: 1.25rem">Enter The Forge</p>
                </div>
                <div id="particle1" style="top: 40px; position: absolute">
                </div>
            </div>

        </div>
    </div>

    <div id="loading-big-circle" class="circleOverlay" style="transition: all 0.5s ease-out; overflow: hidden;">
        <div id="loader" class="LoaderOverlay Center" style="margin: auto; display: flex; justify-content: center; z-index: 1001; height: fit-content">
            <div class="Bar" style="margin-left: 30px; animation-delay: 0.25s"></div>
            <div class="Bar" style="margin-left: 30px; animation-delay: 0.5s"></div>
            <div class="Bar" style="margin-left: 30px; animation-delay: 0.75s"></div>
            <div class="Bar" style="margin-left: 30px; animation-delay: 1s"></div>
            <div class="Bar" style="margin-left: 30px; animation-delay: 1.25s"></div>
        </div>
    </div>

    <script src="./static/design-related.js"></script>

</body>
</html>
